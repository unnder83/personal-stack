# 注意：本项目不在文件内固定 name，避免误对生产项目执行操作。
# 生产与本地都请显式使用 -p：生产 deploy-release.sh 用 -p personal-stack；
# 本地冒烟/测试用 `-p <独立项目名>`（例如 personal-stack-smoke）。

networks:
  appnet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${STACK_DATA:-/srv/stack}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [appnet]

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.28.0.0/16
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB}
      COOKIE_SECURE: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ${STACK_DATA:-/srv/stack}/data/files:/app/data/files
    depends_on:
      mysql:
        condition: service_healthy
    networks: [appnet]

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    networks: [appnet]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      GRAFANA_AUTH_USER: ${GRAFANA_AUTH_USER:-viewer}
      GRAFANA_AUTH_HASH: ${GRAFANA_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STACK_DATA:-/srv/stack}/caddy/data:/data
      - ${STACK_DATA:-/srv/stack}/caddy/config:/config
    depends_on: [api, web]
    networks: [appnet]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]
    networks: [appnet]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${STACK_DATA:-/srv/stack}/monitoring/prometheus:/prometheus
    networks: [appnet]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:?请在 .env 设置 PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ${STACK_DATA:-/srv/stack}/monitoring/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [appnet]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [appnet]

